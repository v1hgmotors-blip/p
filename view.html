<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공유 기능 검사</title>
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box; }
  body{ margin:0; padding:16px; background:#0B1220; color:#E2E8F0;
        font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif; }
  h1{ font-size:19px; margin:0 0 4px; color:#93C5FD; }
  .sub{ font-size:12px; color:#94A3B8; margin-bottom:14px; line-height:1.6; }
  .card{ background:#0F2447; border:2px solid #2C4E7E; border-radius:14px;
         padding:13px 14px; margin-bottom:12px; }
  .card h2{ font-size:14px; margin:0 0 9px; color:#DBEAFE; }
  .row{ display:flex; justify-content:space-between; gap:10px; font-size:13px;
        padding:6px 0; border-bottom:1px solid rgba(255,255,255,.07); line-height:1.5; }
  .row:last-child{ border-bottom:none; }
  .row b{ font-weight:800; color:#CBD5E1; flex:1; }
  .ok{ color:#4ADE80; font-weight:900; white-space:nowrap; }
  .no{ color:#F87171; font-weight:900; white-space:nowrap; }
  button{ width:100%; padding:14px; margin-bottom:8px; border:none; border-radius:11px;
          font-size:15px; font-weight:900; font-family:inherit; cursor:pointer;
          touch-action:manipulation; color:#fff; }
  .b1{ background:#2563EB; } .b2{ background:#16A34A; } .b3{ background:#B45309; } .b4{ background:#7C3AED; } .b5{ background:#0E7490; } .b6{ background:#BE185D; }
  #log{ background:#020617; border:1px solid #1E293B; border-radius:10px; padding:11px;
        font-size:12.5px; line-height:1.8; white-space:pre-wrap; word-break:break-all;
        min-height:90px; color:#BBF7D0; }
  .ua{ font-size:11px; color:#64748B; word-break:break-all; line-height:1.6; margin-top:4px; }
</style>
</head>
<body>

<h1>📤 공유 기능 검사</h1>
<div class="sub">
  이 화면을 <b>삼성 인터넷</b>과 <b>크롬</b>에서 각각 열어 아래 버튼을 눌러 보세요.<br>
  결과를 그대로 알려주시면 원인을 정확히 짚을 수 있습니다.
</div>

<div class="card">
  <h2>1. 이 브라우저가 지원하는 것</h2>
  <div id="caps"></div>
</div>

<div class="card">
  <h2>2. 눌러서 직접 시험</h2>
  <button class="b1" onclick="tryText()">① 글자만 공유해 보기</button>
  <button class="b2" onclick="tryFile('png')">② 사진(PNG) 공유해 보기</button>
  <button class="b3" onclick="tryFile('pdf')">③ 서류(PDF) 공유해 보기</button>
  <button class="b4" onclick="tryAlt('octet')">④ PDF를 「일반파일」로 바꿔 공유</button>
  <button class="b5" onclick="tryAlt('noType')">⑤ PDF를 「종류없음」으로 공유</button>
  <button class="b6" onclick="tryAlt('toPng')">⑥ PDF 대신 사진으로 바꿔 공유</button>
</div>

<div class="card">
  <h2>3. 결과</h2>
  <div id="log">아직 아무 버튼도 누르지 않았습니다.</div>
</div>

<div class="card">
  <h2>4. 브라우저 정보</h2>
  <div class="ua" id="ua"></div>
</div>

<script>
/* ── 작은 시험용 파일 두 개 (바깥에서 받아오지 않음) ── */
var PNG = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAJ0lEQVR42mNkYPhfz0AEYBxVSF+FjAxkAsZRhfRVyMhAJmAcVUhfhQBhhwOBmTOEBwAAAABJRU5ErkJggg==';
var PDF = 'data:application/pdf;base64,JVBERi0xLjEKMSAwIG9iajw8L1R5cGUvQ2F0YWxvZy9QYWdlcyAyIDAgUj4+ZW5kb2JqCjIgMCBvYmo8PC9UeXBlL1BhZ2VzL0tpZHNbMyAwIFJdL0NvdW50IDE+PmVuZG9iagozIDAgb2JqPDwvVHlwZS9QYWdlL1BhcmVudCAyIDAgUi9NZWRpYUJveFswIDAgOTkgOTldPj5lbmRvYmoKdHJhaWxlcjw8L1Jvb3QgMSAwIFI+Pg==';

function $(id){ return document.getElementById(id); }

function say(msg){
  var el = $('log');
  var t = new Date().toLocaleTimeString('ko-KR');
  el.textContent = '[' + t + ']\n' + msg + '\n\n' + el.textContent;
}

function mark(ok){ return ok ? '<span class="ok">있음 ✅</span>' : '<span class="no">없음 ❌</span>'; }

function toFile(dataUrl, name){
  var ci = dataUrl.indexOf(',');
  var mime = /^data:([^;,]+)/.exec(dataUrl)[1];
  var bin = atob(dataUrl.slice(ci + 1));
  var arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new File([arr], name, { type: mime });
}

/* ── 1. 지원 여부 확인 ── */
(function(){
  var rows = [];
  var hasShare    = !!navigator.share;
  var hasCanShare = !!navigator.canShare;
  rows.push(['공유 기능 (navigator.share)', mark(hasShare)]);
  rows.push(['파일 검사 (navigator.canShare)', mark(hasCanShare)]);
  rows.push(['보안 주소 (https)', mark(window.isSecureContext)]);

  if (hasCanShare){
    try{ rows.push(['글자 공유 가능?', mark(navigator.canShare({ text: '시험' }))]); }
    catch(e){ rows.push(['글자 공유 가능?', '<span class="no">예외: ' + e.name + '</span>']); }
    try{ rows.push(['사진(PNG) 공유 가능?', mark(navigator.canShare({ files: [toFile(PNG, '시험.png')] }))]); }
    catch(e){ rows.push(['사진(PNG) 공유 가능?', '<span class="no">예외: ' + e.name + '</span>']); }
    try{ rows.push(['서류(PDF) 공유 가능?', mark(navigator.canShare({ files: [toFile(PDF, '시험.pdf')] }))]); }
    catch(e){ rows.push(['서류(PDF) 공유 가능?', '<span class="no">예외: ' + e.name + '</span>']); }
  }

  $('caps').innerHTML = rows.map(function(r){
    return '<div class="row"><b>' + r[0] + '</b>' + r[1] + '</div>';
  }).join('');

  $('ua').textContent = navigator.userAgent;
})();

/* ── 2. 실제로 눌러서 시험 ── */
function tryText(){
  if (!navigator.share){ say('① 글자 공유 — 이 브라우저에는 공유 기능이 아예 없습니다.'); return; }
  try{
    navigator.share({ title: '시험', text: '공유 시험입니다' })
      .then(function(){ say('① 글자 공유 — 성공 ✅ (공유창이 떴고 보냈습니다)'); })
      .catch(function(e){ say('① 글자 공유 — 실패 ❌\n오류이름: ' + (e && e.name) + '\n내용: ' + (e && e.message)); });
  }catch(e){ say('① 글자 공유 — 바로 예외 ❌\n오류이름: ' + e.name + '\n내용: ' + e.message); }
}

function tryFile(kind){
  var no = (kind === 'png') ? '②' : '③';
  var nm = (kind === 'png') ? '사진(PNG)' : '서류(PDF)';
  if (!navigator.share){ say(no + ' ' + nm + ' — 이 브라우저에는 공유 기능이 아예 없습니다.'); return; }
  var f;
  try{ f = toFile(kind === 'png' ? PNG : PDF, kind === 'png' ? '시험.png' : '시험.pdf'); }
  catch(e){ say(no + ' ' + nm + ' — 파일을 만들지 못했습니다 ❌\n' + e.message); return; }

  var can = '확인불가';
  try{ if (navigator.canShare) can = navigator.canShare({ files: [f] }) ? '가능' : '불가'; }catch(e){ can = '예외 ' + e.name; }

  try{
    navigator.share({ files: [f], title: nm + ' 시험' })
      .then(function(){ say(no + ' ' + nm + ' — 성공 ✅ (canShare 판정: ' + can + ')'); })
      .catch(function(e){ say(no + ' ' + nm + ' — 실패 ❌ (canShare 판정: ' + can + ')\n오류이름: ' + (e && e.name) + '\n내용: ' + (e && e.message)); });
  }catch(e){
    say(no + ' ' + nm + ' — 바로 예외 ❌ (canShare 판정: ' + can + ')\n오류이름: ' + e.name + '\n내용: ' + e.message);
  }
}

/* ── ④⑤⑥ 다른 방법으로 PDF 보내기 ── */
function tryAlt(mode){
  if (!navigator.share){ say('이 브라우저에는 공유 기능이 없습니다.'); return; }
  var f, label;
  try{
    var ci = PDF.indexOf(',');
    var bin = atob(PDF.slice(ci + 1));
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);

    if (mode === 'octet'){
      f = new File([arr], '시험.pdf', { type: 'application/octet-stream' });
      label = '④ PDF를 「일반파일」로';
    } else if (mode === 'noType'){
      f = new File([arr], '시험.pdf');
      label = '⑤ PDF를 「종류없음」으로';
    } else {
      /* ⑥ 내용은 사진으로 — PDF 대신 그림 한 장을 보낸다 */
      var ci2 = PNG.indexOf(',');
      var b2 = atob(PNG.slice(ci2 + 1));
      var a2 = new Uint8Array(b2.length);
      for (var j = 0; j < b2.length; j++) a2[j] = b2.charCodeAt(j);
      f = new File([a2], '시험_등록증.png', { type: 'image/png' });
      label = '⑥ PDF 대신 사진으로';
    }
  }catch(e){ say('파일을 만들지 못했습니다 ❌\n' + e.message); return; }

  var can = '확인불가';
  try{ if (navigator.canShare) can = navigator.canShare({ files: [f] }) ? '가능' : '불가'; }catch(e){ can = '예외 ' + e.name; }

  try{
    navigator.share({ files: [f], title: '시험' })
      .then(function(){ say(label + ' — 성공 ✅ (canShare 판정: ' + can + ')'); })
      .catch(function(e){ say(label + ' — 실패 ❌ (canShare 판정: ' + can + ')\n오류이름: ' + (e && e.name) + '\n내용: ' + (e && e.message)); });
  }catch(e){ say(label + ' — 바로 예외 ❌\n오류이름: ' + e.name); }
}
</script>
</body>
</html>
